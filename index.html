<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B L Agro Sales</title>
<style>
body{font:15px system-ui;margin:0;background:#f4f7f4;color:#17241b}header{background:#155d36;color:white;padding:20px}main{max-width:850px;margin:18px auto;padding:0 12px}.card{background:white;border:1px solid #dce7df;border-radius:14px;padding:16px;margin:12px 0}h2{color:#155d36}label{display:block;margin:10px 0 4px;font-weight:bold}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #bdcfc2;border-radius:8px;font:inherit}.btn{padding:10px 14px;background:#155d36;color:white;border:0;border-radius:8px;margin:8px 5px 0 0}.alt{background:#eaf6ee;color:#155d36}.hidden{display:none!important}.msg{background:#eaf6ee;padding:10px;border-radius:8px}.bad{background:#ffeded;color:#a21d16}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.item{border:1px solid #dce7df;border-radius:9px;padding:12px}nav{display:flex;flex-wrap:wrap;gap:5px}nav button{background:#eaf6ee;color:#155d36;border:0;border-radius:8px;padding:9px}
</style><body><header><h1>🌱 B L Agro Sales</h1>Khaad, Beej va Keetnashak Kendra</header><main>
<section id="auth" class="card"><h2 id="title">Login</h2><p>Owner ईमेल से और किसान/रिटेलर मोबाइल नंबर से लॉगिन करेंगे। SMS OTP नहीं है।</p>
<label>लॉगिन प्रकार</label><select id="kind"><option value="customer">किसान / रिटेलर — मोबाइल</option><option value="owner">Owner — ईमेल</option></select>
<label>खाता</label><select id="mode"><option value="login">Login</option><option value="signup">नया खाता</option></select>
<div id="phoneBox"><label>10 अंकों का मोबाइल</label><input id="phone" maxlength="10" inputmode="numeric"></div><div id="emailBox" class="hidden"><label>Owner ईमेल</label><input id="email" type="email" value="Kppl822395@email.com"></div>
<div id="nameBox" class="hidden"><label>नाम</label><input id="name"></div><div id="roleBox" class="hidden"><label>खाता प्रकार</label><select id="wanted"><option value="farmer">किसान</option><option value="retailer">रिटेलर</option></select></div><div id="codeBox" class="hidden"><label>रिटेलर गुप्त कोड</label><input id="code" type="password"></div>
<label>पासवर्ड (कम से कम 8 अक्षर)</label><input id="pass" type="password"><button class="btn" id="go">Login</button><p id="authMsg" class="msg">Owner खाता Firebase Authentication में पहले से बना होना चाहिए।</p></section>
<section id="app" class="hidden"><nav><button data-page="home">डैशबोर्ड</button><button data-page="catalog">रेट</button><button data-page="booking">बुकिंग</button><button data-page="orders">मेरी बुकिंग</button><button id="adminButton" data-page="admin" class="hidden">Owner Admin</button><button class="btn" id="logout">Logout</button></nav>
<div id="home" class="card"><h2 id="welcome"></h2><p id="info"></p><p id="status" class="msg"></p></div><div id="catalog" class="card hidden"><h2>आपके उत्पाद और रेट</h2><div id="products" class="grid"></div></div>
<div id="booking" class="card hidden"><h2>बुकिंग</h2><label>उत्पाद</label><select id="product"></select><label>मात्रा</label><input id="qty" type="number" min="1" value="1"><button class="btn" id="book">बुकिंग भेजें</button><p id="bookMsg" class="msg"></p></div>
<div id="orders" class="card hidden"><h2>बुकिंग इतिहास</h2><div id="orderList"></div></div>
<div id="admin" class="card hidden"><h2>Owner Admin</h2><h3>उत्पाद जोड़ें</h3><label>नाम</label><input id="pname"><label>किसान रेट ₹</label><input id="frate" type="number"><label>रिटेलर रेट ₹</label><input id="rrate" type="number"><label>यूनिट</label><input id="unit" value="Bag"><button class="btn" id="save">सेव करें</button><h3>रिटेलर अनुरोध</h3><div id="users"></div><h3>सभी बुकिंग</h3><div id="allOrders"></div></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,addDoc,getDocs,updateDoc,query,where,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAKA5phnm0IB7s23CTRrbYBKrQtS45Z6xE",authDomain:"bl-agro-sales.firebaseapp.com",projectId:"bl-agro-sales",storageBucket:"bl-agro-sales.firebasestorage.app",messagingSenderId:"57470712067",appId:"1:57470712067:web:5aea23b865148adf3c1136"};
const OWNER="9nO7ft4BwdaGja7NpvDn9KYjiUN2",OWNER_EMAIL="Kppl822395@email.com",a=initializeApp(cfg),auth=getAuth(a),db=getFirestore(a),$=x=>document.getElementById(x);
let user,profile,products=[],rates={},orders=[];
const isOwner=()=>user?.uid===OWNER,role=()=>isOwner()?"owner":profile?.role||"farmer",emailFor=p=>p+"@blagro-login.invalid";
function message(id,t,bad=false){$(id).textContent=t;$(id).classList.toggle("bad",bad)}
function fields(){let own=$("kind").value==="owner",sign=$("mode").value==="signup";$("phoneBox").classList.toggle("hidden",own);$("emailBox").classList.toggle("hidden",!own);$("nameBox").classList.toggle("hidden",own||!sign);$("roleBox").classList.toggle("hidden",own||!sign);$("codeBox").classList.toggle("hidden",own||!sign||$("wanted").value!=="retailer");}
["kind","mode","wanted"].forEach(x=>$(x).onchange=fields);fields();
$("go").onclick=async()=>{try{let own=$("kind").value==="owner",sign=$("mode").value==="signup",pw=$("pass").value;if(pw.length<8)throw Error("पासवर्ड कम से कम 8 अक्षर का रखें।");if(own){if(sign||$("email").value.trim().toLowerCase()!==OWNER_EMAIL.toLowerCase())throw Error("Owner के लिए सही ईमेल से Login करें।");await signInWithEmailAndPassword(auth,OWNER_EMAIL,pw)}else{let ph=$("phone").value.replace(/\D/g,"");if(!/^[6-9]\d{9}$/.test(ph))throw Error("सही 10 अंकों का मोबाइल डालें।");if(sign){if(!$("name").value.trim())throw Error("नाम लिखें।");let w=$("wanted").value,c=await createUserWithEmailAndPassword(auth,emailFor(ph),pw),uid=c.user.uid;if(w==="retailer")await setDoc(doc(db,"retailerRequests",uid),{uid,phone:ph,name:$("name").value.trim(),code:$("code").value,createdAt:serverTimestamp()});await setDoc(doc(db,"users",uid),{uid,phone:ph,name:$("name").value.trim(),role:"farmer",requestedRole:w,approved:w==="farmer",createdAt:serverTimestamp()})}else await signInWithEmailAndPassword(auth,emailFor(ph),pw)}message("authMsg","सफल।")}catch(e){message("authMsg",e.message,true)}};
onAuthStateChanged(auth,async u=>{user=u;if(!u){$("auth").classList.remove("hidden");$("app").classList.add("hidden");return}try{if(isOwner())profile={name:"Owner",role:"owner",approved:true};else{let s=await getDoc(doc(db,"users",u.uid));if(!s.exists())throw Error("प्रोफाइल नहीं मिली।");profile=s.data()}$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("adminButton").classList.toggle("hidden",!isOwner());$("welcome").textContent="नमस्ते "+profile.name;$("info").textContent=isOwner()?"Owner":profile.phone+" · "+role();if(profile.requestedRole==="retailer"&&!profile.approved)message("status","रिटेलर अकाउंट Owner की मंजूरी के इंतजार में है।");await load()}catch(e){message("authMsg",e.message,true);await signOut(auth)}});
async function load(){let p=await getDocs(collection(db,"products"));products=p.docs.map(d=>({id:d.id,...d.data()}));rates={};if(isOwner()||(role()==="retailer"&&profile.approved)){let r=await getDocs(collection(db,"retailerRates"));r.docs.forEach(d=>rates[d.id]=d.data().rate)}renderProducts();let q=isOwner()?query(collection(db,"bookings"),orderBy("createdAt","desc")):query(collection(db,"bookings"),where("uid","==",user.uid));let b=await getDocs(q);orders=b.docs.map(d=>({id:d.id,...d.data()}));renderOrders();if(isOwner())await renderAdmin()}
function renderProducts(){$("products").innerHTML=products.map(p=>`<div class="item"><b>${p.name}</b><p>₹${Number(role()==="retailer"?rates[p.id]:p.farmerRate||0).toLocaleString("en-IN")} / ${p.unit||"unit"}</p></div>`).join("")||"अभी उत्पाद नहीं";$("product").innerHTML=products.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")}
function renderOrders(){$("orderList").innerHTML=orders.map(o=>`<div class="item">${o.productName} × ${o.quantity} · ${o.token} · ${o.status}</div>`).join("")||"कोई बुकिंग नहीं"}
$("book").onclick=async()=>{try{if(profile.requestedRole==="retailer"&&!profile.approved)throw Error("Owner approval बाकी है।");let p=products.find(x=>x.id===$("product").value),q=Number($("qty").value);if(!p||q<1)throw Error("उत्पाद/मात्रा सही चुनें।");let token="BL-"+Date.now().toString(36);await addDoc(collection(db,"bookings"),{uid:user.uid,phone:profile.phone||"",customerName:profile.name,productId:p.id,productName:p.name,quantity:q,unit:p.unit||"Bag",unitRate:Number(role()==="retailer"?rates[p.id]:p.farmerRate||0),token,status:"Pending",createdAt:serverTimestamp()});message("bookMsg","बुकिंग हो गई। Token: "+token);await load()}catch(e){message("bookMsg",e.message,true)}};
$("save").onclick=async()=>{try{if(!isOwner())throw Error("केवल Owner");let n=$("pname").value.trim(),f=Number($("frate").value),r=Number($("rrate").value);if(!n||f<0||r<0)throw Error("नाम और दोनों रेट भरें");let d=await addDoc(collection(db,"products"),{name:n,farmerRate:f,unit:$("unit").value||"Bag",active:true,createdAt:serverTimestamp()});await setDoc(doc(db,"retailerRates",d.id),{rate:r,updatedAt:serverTimestamp()});await load();alert("उत्पाद सेव हुआ।")}catch(e){alert(e.message)}};
async function renderAdmin(){let u=await getDocs(collection(db,"users"));$("users").innerHTML=u.docs.filter(d=>d.id!==user.uid).map(d=>{let x=d.data();return `<div class="item">${x.name||""} ${x.phone||""} · ${x.requestedRole||x.role} ${x.approved?"Approved":"Pending"} <button class="btn" data-user="${d.id}">Retailer approve</button></div>`}).join("")||"कोई अनुरोध नहीं";$("users").querySelectorAll("[data-user]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.user),{role:"retailer",approved:true});await load()});$("allOrders").innerHTML=orders.map(o=>`<div class="item">${o.customerName||""} ${o.phone||""} · ${o.productName} × ${o.quantity}</div>`).join("")}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>["home","catalog","booking","orders","admin"].forEach(x=>$(x).classList.toggle("hidden",x!==b.dataset.page)));
$("logout").onclick=()=>signOut(auth);
</script></body></html>
